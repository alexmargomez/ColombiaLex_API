services:
  db:
    image: mariadb:11
    container_name: alcontable_mariadb
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE:-alcontable_db}"
      MARIADB_USER: "${MARIADB_USER:-alcontable_user}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-alcontable_pass_2026}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-alcontable_root_2026}"
    ports:
      - "${DB_EXTERNAL_PORT:-3312}:3306"
    volumes:
      - alcontable_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    image: maven:3.9.9-eclipse-temurin-21-alpine
    container_name: alcontable_backend
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command: ["mvn package -DskipTests -B && exec java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -jar target/alcontable-api-1.0.0.jar"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_PORT: "${BACKEND_PORT:-8085}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-alcontable_db}"
      MARIADB_USER: "${MARIADB_USER:-alcontable_user}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-alcontable_pass_2026}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
    ports:
      - "${BACKEND_PORT:-8085}:${BACKEND_PORT:-8085}"
    volumes:
      - ./backend:/app
      - alcontable_maven_repo:/root/.m2
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: alcontable_frontend
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command: ["[ -d node_modules/@rollup/rollup-linux-x64-musl ] || npm install; npx vite --host 0.0.0.0 --port $${FRONTEND_PORT:-5176}"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FRONTEND_PORT: "${FRONTEND_PORT:-5176}"
      BACKEND_PORT: "${BACKEND_PORT:-8085}"
      VITE_API_URL: "${VITE_API_URL:-/api}"
      VITE_BACKEND_PROXY: "${VITE_BACKEND_PROXY:-http://backend:${BACKEND_PORT:-8085}}"
    ports:
      - "${FRONTEND_PORT:-5176}:${FRONTEND_PORT:-5176}"
    volumes:
      - ./frontend:/app
      - alcontable_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  alcontable_db_data:
  alcontable_frontend_node_modules:
  alcontable_maven_repo:



