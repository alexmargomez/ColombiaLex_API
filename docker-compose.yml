services:
  db:
    image: mariadb:11
    container_name: colombialex_mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE:-colombialex_db}"
      MARIADB_USER: "${MARIADB_USER:-colombialex_user}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-colombialex_pass_2026}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-colombialex_root_2026}"
    ports:
      - "${DB_EXTERNAL_PORT:-3312}:3306"
    volumes:
      - colombialex_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colombialex_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: "${BACKEND_PORT:-8085}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-colombialex_db}"
      MARIADB_USER: "${MARIADB_USER:-colombialex_user}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-colombialex_pass_2026}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
    ports:
      - "${BACKEND_PORT:-8085}:${BACKEND_PORT:-8085}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: colombialex_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRONTEND_PORT: "${FRONTEND_PORT:-5176}"
      BACKEND_PORT: "${BACKEND_PORT:-8085}"
      VITE_API_URL: "${VITE_API_URL:-/api}"
      VITE_BACKEND_PROXY: "${VITE_BACKEND_PROXY:-http://backend:${BACKEND_PORT:-8085}}"
    ports:
      - "${FRONTEND_PORT:-5176}:${FRONTEND_PORT:-5176}"
    depends_on:
      - backend

volumes:
  colombialex_db_data:
